name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & upload jar
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The image only copies the fat jar, so the jar is built here once and the
      # Docker build stays a plain COPY (no Gradle inside the image).
      - name: Build, test and assemble fat jar
        run: ./gradlew build shadowJar --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload runnable jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/*-all.jar
          if-no-files-found: error
          retention-days: 7

  image:
    name: Image (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            # Native arm64 runner: no emulation at all. Requires a plan that
            # provides arm64 hosted runners (public repos or paid plans).
            runner: ubuntu-26.04-arm

    env:
      DIGEST_DIR: ${{ github.workspace }}/digests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download fat jar
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: build/libs

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      # Built per platform and pushed by digest; the merge job below turns the
      # digests into the multi-arch tags. Pull requests only verify the build.
      - name: Build image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=${{ github.event_name != 'pull_request' }},push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::Build produced no digest to merge"
            exit 1
          fi
          mkdir -p "$DIGEST_DIR"
          touch "$DIGEST_DIR/${DIGEST#sha256:}"
          echo "Digest for ${{ matrix.arch }}: $DIGEST"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ env.DIGEST_DIR }}/*
          if-no-files-found: error
          retention-days: 3

  merge:
    name: Publish multi-arch manifest
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    env:
      DIGEST_DIR: ${{ github.workspace }}/digests

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.DIGEST_DIR }}
          pattern: digest-*
          merge-multiple: true

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Digests collected in $DIGEST_DIR:"
          ls -la "$DIGEST_DIR"

          refs=()
          for digest_file in "$DIGEST_DIR"/*; do
            refs+=("$IMAGE_NAME@sha256:$(basename "$digest_file")")
          done
          if [ ${#refs[@]} -eq 0 ]; then
            echo "::error::No per-platform digests were downloaded; nothing to merge"
            exit 1
          fi

          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$METADATA")
          echo "Publishing ${refs[*]} with tags ${tag_args[*]}"
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE_NAME:${{ steps.meta.outputs.version }}"
